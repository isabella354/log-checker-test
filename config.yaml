# Team robotlogs config. Committed to git, so everyone who clones gets the same settings.
# If you change it, commit and push so the rest of the team stays in sync.
#
# Set up for Team3256/FRC_Offseason_2026. Data comes from CTRE SignalLogger .hoot files
# (the same logs Phoenix Tuner extracts): one folder per robot power-on in /home/lvuser/logs,
# CTRE names match folders like "mttd_Q12", and each folder has one .hoot per CAN bus:
#   rio_<time>.hoot       roboRIO CAN bus (mechanisms)        -> signals named "rio/..."
#   <serial>_<time>.hoot  CANivore "main" (drivetrain)        -> signals named "canivore/..."
# If a motor's CAN ID changes in the robot code, update it here.

team: 3256                   # used to build roboRIO addresses (USB, 10.TE.AM.2, mDNS)
# robot_hosts: [172.22.11.2]   # optional: override the address list entirely
ssh_user: lvuser
ssh_password: ""
remote_log_dirs:
  - /home/lvuser/logs          # CTRE SignalLogger .hoot files (session subfolders are searched too)

local_log_dir: ./logs          # downloaded raw logs (kept so you can re-run with a new signal_map)
db_path: ./robot_trends.db
poll_interval_s: 10
settle_s: 2.0                  # re-check file size after this long; a growing file is the active log
sample_rate_hz: 50             # every signal is resampled onto this grid during the enabled window

# .hoot files are converted with CTRE's owlet, using the version that matches each file.
# AdvantageScope downloads these automatically (open any .hoot from the robot in it once).
# Its download folder is searched by default; add other folders here if needed.
owlet_dirs: []
owlet_args: ["-f", "wpilog"]

# ---------------------------------------------------------------------------
# signal_map: a translation table from "what this tool wants" to "what the
# log calls it". The tool only reads the signals listed here.
# A name that doesn't exist in the log just gives an empty metric, not an error.
# ---------------------------------------------------------------------------
signal_map:
  enabled: "rio/RobotEnable"
  # These are written by Robot.driverStationConnected(), but usually before the field sends
  # match info, so they come out blank. The event/match are then read from CTRE's folder name.
  event_name: "rio/EventName"
  match_type: "rio/MatchType"
  match_number: "rio/MatchNumber"
  system_time: null              # hoot files have no wall clock; the start time comes from the file name

  # No PDH in the logs, so battery voltage = average supply voltage measured at the four drive
  # motors (reads a little below the true battery voltage under heavy load, because of wiring).
  battery_voltage:
    - "canivore/TalonFX-4/SupplyVoltage"
    - "canivore/TalonFX-0/SupplyVoltage"
    - "canivore/TalonFX-6/SupplyVoltage"
    - "canivore/TalonFX-2/SupplyVoltage"
  # Not logged; total current = sum of all motor supply currents below (every TalonFX on the robot).
  total_current: null
  brownout: null
  battery_id: null

  # Temperature isn't available: CTRE only exports it for Phoenix Pro-licensed devices.
  motors:
    # Drivetrain (CANivore). IDs from swerve/generated/TunerConstants.java
    drive_fl:
      supply: "canivore/TalonFX-4/SupplyCurrent"
      stator: "canivore/TalonFX-4/StatorCurrent"
    drive_fr:
      supply: "canivore/TalonFX-0/SupplyCurrent"
      stator: "canivore/TalonFX-0/StatorCurrent"
    drive_bl:
      supply: "canivore/TalonFX-6/SupplyCurrent"
      stator: "canivore/TalonFX-6/StatorCurrent"
    drive_br:
      supply: "canivore/TalonFX-2/SupplyCurrent"
      stator: "canivore/TalonFX-2/StatorCurrent"
    steer_fl:
      supply: "canivore/TalonFX-5/SupplyCurrent"
      stator: "canivore/TalonFX-5/StatorCurrent"
    steer_fr:
      supply: "canivore/TalonFX-3/SupplyCurrent"
      stator: "canivore/TalonFX-3/StatorCurrent"
    steer_bl:
      supply: "canivore/TalonFX-7/SupplyCurrent"
      stator: "canivore/TalonFX-7/StatorCurrent"
    steer_br:
      supply: "canivore/TalonFX-1/SupplyCurrent"
      stator: "canivore/TalonFX-1/StatorCurrent"
    # Mechanisms (roboRIO CAN bus). IDs from each subsystem's *Constants.java
    shooter_top_left:
      supply: "rio/TalonFX-44/SupplyCurrent"
      stator: "rio/TalonFX-44/StatorCurrent"
    shooter_bottom_left:
      supply: "rio/TalonFX-45/SupplyCurrent"
      stator: "rio/TalonFX-45/StatorCurrent"
    shooter_top_right:
      supply: "rio/TalonFX-42/SupplyCurrent"
      stator: "rio/TalonFX-42/StatorCurrent"
    shooter_bottom_right:
      supply: "rio/TalonFX-41/SupplyCurrent"
      stator: "rio/TalonFX-41/StatorCurrent"
    shooter_pivot:
      supply: "rio/TalonFX-51/SupplyCurrent"
      stator: "rio/TalonFX-51/StatorCurrent"
    feeder_left:
      supply: "rio/TalonFX-47/SupplyCurrent"
      stator: "rio/TalonFX-47/StatorCurrent"
    feeder_right:
      supply: "rio/TalonFX-43/SupplyCurrent"
      stator: "rio/TalonFX-43/StatorCurrent"
    indexer_left:
      supply: "rio/TalonFX-46/SupplyCurrent"
      stator: "rio/TalonFX-46/StatorCurrent"
    indexer_right:
      supply: "rio/TalonFX-27/SupplyCurrent"
      stator: "rio/TalonFX-27/StatorCurrent"
    intake_left:
      supply: "rio/TalonFX-19/SupplyCurrent"
      stator: "rio/TalonFX-19/StatorCurrent"
    intake_right:
      supply: "rio/TalonFX-28/SupplyCurrent"
      stator: "rio/TalonFX-28/StatorCurrent"
    slide_left:
      supply: "rio/TalonFX-40/SupplyCurrent"
      stator: "rio/TalonFX-40/StatorCurrent"
    slide_right:
      supply: "rio/TalonFX-39/SupplyCurrent"
      stator: "rio/TalonFX-39/StatorCurrent"

# Defaults are fine; tweak later if alerts are too noisy or too quiet.
thresholds:
  low_voltage: 8.0
  critical_voltage: 7.0
  hot_motor_c: 70

alerts:
  history_matches: 20          # rolling window for baselines
  min_history: 5               # don't alert until we have this many prior matches
  z_threshold: 2.0
  wear_slope_per_match: 0.02   # flag avg stator current rising >2% of its mean per match
