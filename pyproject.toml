[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotlogs"
version = "0.1.0"
description = "Pull FRC robot logs from the roboRIO, summarize each match, and track trends across a season."
requires-python = ">=3.10"
dependencies = [
  "paramiko>=3.0",
  "robotpy-wpiutil>=2024.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "pandas>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
robotlogs = "robotlogs.cli:main"

[tool.setuptools]
packages = ["robotlogs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
